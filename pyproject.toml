[project]
name = "tfm-master-thesis"
version = "0.1.0"
description = "Evaluation of Tabular Foundation Models for outlier detection on tabular data with free-text features"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Florian Veitz", email = "florian.veitz@smail.th-koeln.de" }]
keywords = ["outlier-detection", "anomaly-detection", "tabular-foundation-models", "tabpfn", "contexttab"]
dependencies = [
    "sap-rpt-oss",
    "pandas",
    "numpy",
    "scikit-learn",
    "sentence-transformers",
    "tabpfn",
    "ipykernel",
    "python-dotenv",
    "pyod",
    "mlflow",
    "tabpfn-extensions",
    "peft",
    "accelerate",
    "shap",
    "datasets",
    "safetensors",
    "fasttext-wheel>=0.9.2",
]

[tool.uv.sources]
sap-rpt-oss = { git = "https://github.com/SAP-samples/sap-rpt-1-oss.git" }
