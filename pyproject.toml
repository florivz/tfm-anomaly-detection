[project]
name = "tfm-master-thesis"
version = "0.1.0"
description = "Code for 'Evaluating Foundation Model Embeddings for Anomaly Detection in Multivariate Tabular Data': tabular foundation models for unsupervised outlier detection on tabular data with free-text features"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Florian Veitz", email = "contact@florian-veitz.de" }]
keywords = ["outlier-detection", "anomaly-detection", "tabular-foundation-models", "tabpfn", "contexttab"]
dependencies = [
    "sap-rpt-oss",
    "pandas",
    "numpy",
    "scikit-learn",
    "sentence-transformers",
    "tabpfn",
    "ipykernel",
    "python-dotenv",
    "pyod",
    "mlflow",
    "tabpfn-extensions",
    "peft",
    "accelerate",
    "shap",
    "datasets",
    "safetensors",
    "fasttext-wheel>=0.9.2",
]

[project.urls]
Repository = "https://github.com/florivz/tfm-anomaly-detection"
"Experiment logs" = "https://doi.org/10.5281/zenodo.24141080"

[tool.uv.sources]
sap-rpt-oss = { git = "https://github.com/SAP-samples/sap-rpt-1-oss.git" }

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
